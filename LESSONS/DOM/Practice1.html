<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM PRACTICE</title>

    <style>


    h1{
      font-size: 150px;
      
    }

    #container{
        height: 80vh;
        width: 90vh;
        border: solid;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

      .btns{
 
       height: 30px; 
       width:100px;
       border-radius: 20px;
       padding:5px;
      }
   
       #buttons {
        display: flex;
        gap: 20px;
     }
    
    </style>
</head>
<body>


    <div id="container">

        <h1 id="counter">0</h1>

         <div id="buttons">
            <button class = "btns"  id="increase-btn">INCREASE </button>
            <button class = "btns"  id="decrease-btn">DECREASE </button>
            <button class = "btns"  id="reset-btn">RESET </button>
            <button class = "btns"  id="save-btn">SAVE </button>
            <button class = "btns"  id="load-btn">LOAD COUNT </button>
         </div>

    </div>



    <script>

    let count = 0;

    const increase = document.getElementById('increase-btn');
    const decreaseButton = document.getElementById('decrease-btn');
    const reset = document.getElementById('reset-btn');
    const save= document.getElementById('save-btn');
    const load = document.getElementById('load-btn');

    const counter = document.getElementById('counter'); 
    
    
    
    const updateCount = () => {
     counter.innerHTML = count;
    }

    const increaseCount = () => {
      count++;
      updateCount(); 
    }

    const decreaseCount = () => {
      count--;
      updateCount(); 
    }

    const resetCount = () => {
        count = 0;
        updateCount(); 
    }

    const saveCount = () => {
       localStorage.setItem("count", count);
    }


    const loadCount = () => {

       let saved = localStorage.getItem("count");

            if (saved !== null) {
                count = Number(saved);
            }
            
            updateCount();
       };


    increase.addEventListener("click", increaseCount); 
    decreaseButton.addEventListener("click", decreaseCount); 
    reset.addEventListener("click", resetCount); 
    save.addEventListener("click", saveCount); 
    load.addEventListener("click", loadCount);  
         







    </script>
    
</body>
</html>

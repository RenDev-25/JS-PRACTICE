<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini To‑Do</title>

  <!-- ============  CSS  ============ -->
  <style>
    * { 
      box-sizing: border-box; 
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    .card {
      max-width: 360px;
      margin: auto;
      background: #fff;
      border-radius: 10px;
      padding: 20px 24px 32px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 18px;
      font-size: 1.4rem;
    }

    /* input + button row */
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    #taskInput {
      flex: 1;
      padding: 9px 10px;
      font-size: 15px;
      border: 2px solid #ddd;
      border-radius: 6px;
    }

    #addBtn {
      padding: 9px 14px;
      font-size: 15px;
      border: none;
      background: #28a745;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    #addBtn:hover {
      background: #21913e; 
    }

    /* task list */
    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 10px 14px;
      border: 2px solid #ececec;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      transition: background .2s;
    }
    

    .liclick{
       background-color: greenyellow;

    }

    li.done {
      background: #e6ffe6; 
    }

    .delete {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #f40707;
      border-radius: 25px;
    }

    .delete:hover{
        background-color: rgb(0, 0, 0);
        color: rgb(239, 0, 0);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>To‑Do List</h1>

    <div class="row">
      <input id="taskInput" type="text" placeholder="Add a task…">
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <!-- ============  JS goes here  ============ -->
  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn    = document.getElementById('addBtn');
    const taskList  = document.getElementById('taskList');

    addBtn.addEventListener("click", addTask);
 
    function addTask() {
      const value = taskInput.value.trim();

      if (value === '') {
        alert("NO INPUT TO ADD");
        return;
      }

      const li = document.createElement("li");
      li.textContent = value;
      taskList.appendChild(li);
      taskInput.value = '';

      const del = document.createElement('button');
      del.textContent = '×';
      del.classList.add('delete');
      li.appendChild(del);

        li.addEventListener('click', function () {
        li.classList.toggle('liclick');
        
      });

    
   
      del.addEventListener('click', function () {
        li.remove();
      });

    


      

    }
  </script>
</body>
</html>

<!-- index.html (short) -->
<!Doctype html>
<html>
  <head><meta charset="utf-8">
    
    <title>Color Flipper</title>


    <style>
       
    body{
    height: 100vh;
    display: flex;
    align-items: start;
    justify-content: left;
    flex-direction: column;
    }

    h1{
        text-align: center;
    }

#swatch {
  width: 320px;
  height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:monospace;
  font-size:22px;
  border-radius:8px;
  margin-bottom:5px;
  border: solid 1px;
}

 button { 
    width:44px; 
    height:44px; 
    margin:6px; 
    border-radius:6px;
    border: 1px solid;

 }

 .btn-container{
    display: flex;
    justify-content: space-around;
    gap: 1px;
    border: solid 1px;
 }

    .m-container{    
        border: solid 1px;
    }

    .m-container h2{    
        text-align: center;
    }


    </style>
</head>
  <body>


    <h1>WELCOME TO THE JAVASCRIPT BEGGINER PROJECTS</h1>

    <div class="m-container">  

        <h2>COLOR FLIPPER</h2>
        <div id="swatch">#FFFFFF</div>

        <div class="btn-container">
            <button id="flip">Flip Color</button>
            <button id="copy">Copy Hex</button>
            <button id="save">Save</button>
        </div>

        <div id="favorites">

        </div>
    </div>


     <script src="colorflip.js">

    </script>
  </body>
</html>

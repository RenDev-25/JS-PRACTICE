<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <title>MOSH</title>
  
  <style>

      body{
            height: 100vh;
            position: relative;
             margin: 0;
            height: 100vh;
            overflow: hidden;
          

      }


       .random-text {
        position: absolute;
        color: rgb(250, 250, 250);
        font-weight: bold;
        font-size: 20px;
        text-shadow: pink;
        z-index: 0;
        background-color: rgb(255, 0, 140);
        padding: 5px;
        border-radius: 10px;
        transition: width 2s ease, height 2s ease, transform 2s ease;

    }

       .m-container{
            background-color: pink;
            width: 100%;
            height: 100%; 
             display: flex;
             justify-content: center;
             align-items: center;
             flex-direction: column;
            
        
       }


       #bday{
            color: rgb(255, 255, 255);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 50px;
            animation-duration: 7s;
            animation-name: example;       
            padding: 10px;
            border-radius: 15px;
            box-shadow:inset;
            text-shadow: 3px 3px rgb(243, 16, 190);
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0.075, 0.82, 0.165, 1);
            animation-direction: alternate-reverse;
            animation-fill-mode: forwards;
            position: relative;
            z-index: 5;
            box-shadow: 0 -5px 10px rgba(255, 255, 255, 0.846), /* top */
            0 5px 10px rgba(255, 255, 255, 0.873);  /* bottom */
            

       }

       #mosh{
            color: rgb(250, 9, 134);
            font-size: 60px;
            font-family: Cambria, Cochin, Georgia,
             Times, 'Times New Roman', serif;
             text-shadow: 2px 2px rgb(255, 255, 255);
            text-shadow: 2px 2px rgb(255, 255, 255);
            animation: move 1s infinite alternate ease-in-out;
            position: relative;
            z-index: 4;
       }

       #mosh:hover{
            color: rgb(240, 0, 84);
      
       }

       
        @keyframes move {
            0%   { transform: translateX(40px); }
            100% { transform: translateX(-60px); }
            
        }

     


                @keyframes example {
                    0%   {background-color: rgb(224, 34, 177);}
                    25%  {background-color: rgb(250, 71, 190);}
                    50%  {background-color: rgb(228, 127, 177);}
                    100% {background-color: rgb(246, 59, 99);}
            }

      @media (max-width: 600px) {

        .m-container{
        
            width: 100%;
            height: 100%; 
             
            
        
       }



       #mosh{
          
            font-size: 40px;
            text-align: center;
            
       }


           #bday{
               margin-left:50px ;
               margin-right: 50px;
               text-align: center;
              margin-bottom: 20px;
           }
          
}






  </style>
</head>
<body>

    <div class="m-container" >
      
        
           <h1 id="bday">HAPPY BIRTHDAY</h1>
           <h1 id="mosh">MOSH🥳</h1>

    
     
    </div>









<script>
     
      document.body.addEventListener("click", function () {
      const randomText = document.createElement("div");
      randomText.classList.add("random-text");
      randomText.textContent = "19th!";

      // Get random x and y positions within the body
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;

      randomText.style.left = `${x}px`;
      randomText.style.top = `${y}px`;

      document.body.appendChild(randomText);
    });

       


</script>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
